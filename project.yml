name: KeepOne
options:
  minimumXcodeGenVersion: 2.38.0
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    PRODUCT_BUNDLE_IDENTIFIER: com.example.keepone
targets:
  KeepOne:
    type: application
    platform: iOS
    sources:
      - path: KeepOne
        excludes:
          - Resources/Info.plist
    resources:
      - KeepOne/Resources
    info:
      path: KeepOne/Resources/Info.plist
    settings:
      base:
        PRODUCT_NAME: KeepOne
        DEVELOPMENT_TEAM: ""
  KeepOneTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - KeepOneTests
    dependencies:
      - target: KeepOne
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
